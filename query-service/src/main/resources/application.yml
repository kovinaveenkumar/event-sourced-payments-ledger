server:
  port: 8082

spring:
  application:
    name: query-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readmodel}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      read-only: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
