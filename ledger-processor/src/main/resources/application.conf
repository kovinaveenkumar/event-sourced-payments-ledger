ledger {
  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP}
    topic = "ledger-events"
    topic = ${?LEDGER_TOPIC}
    group-id = "ledger-processor"
    group-id = ${?CONSUMER_GROUP}
  }

  db {
    url = "jdbc:postgresql://localhost:5432/readmodel"
    url = ${?DB_URL}
    user = "ledger"
    user = ${?DB_USER}
    password = "ledger"
    password = ${?DB_PASSWORD}
    pool-size = 4
  }

  http.port = 8083
  http.port = ${?HTTP_PORT}

  fraud {
    # More than 5 outgoing payments from one account inside 60 seconds
    velocity { max-count = 5, window = 60s }
    # More than 5,000.00 leaving one account inside 10 minutes
    volume { max-amount-cents = 500000, window = 10m }
    # Any single outgoing payment of 10,000.00 or more
    large-transaction-cents = 1000000
  }

  # Database calls block, so they get their own thread pool and don't slow down Akka.
  blocking-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor.fixed-pool-size = 4
    throughput = 1
  }
}

akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  kafka.consumer {
    kafka-clients {
      auto.offset.reset = "earliest"
      enable.auto.commit = false
    }
  }
}
